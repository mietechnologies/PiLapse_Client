# PiLapse — Profile: default
# Location: ~/.config/timelapse/profiles/default.yaml
#
# Copy this to ~/.config/timelapse/profiles/<name>.yaml for each setup.
# Use `timelapse --profile <name> setup` to generate interactively.

# ─── Storage directories ─────────────────────────────────────────────────────
# {profile} is replaced with the profile name at runtime.
# Use absolute paths or ~ for home directory.
photos_dir: "~/timelapse/default/photos"
videos_dir: "~/timelapse/default/videos"
archive_dir: "~/timelapse/default/archive"

# ─── Camera / still capture ──────────────────────────────────────────────────
capture:
  width: 1920          # Max: 4056 (IMX477), 3280 (IMX219), 4608 (IMX708)
  height: 1080
  # The camera keeps 4 buffers of width x height x 1.5 bytes reserved while
  # running (~3 MB each at 1920x1080, ~18 MB at 4056x3040).  On a 512 MB
  # Pi Zero 2 W, if the camera fails to start at a large size, reduce it.
  jpeg_quality: 85     # 1-100; 85 is a good balance for storage vs quality
  capture_timeout_s: 10

# ─── Capture schedule ────────────────────────────────────────────────────────
# Choose ONE mode: interval | times | solar

# Mode 1: Fixed interval
schedule:
  mode: interval
  interval: "5m"       # Supported units: s, m, h, d

# Mode 2: Specific times each day (uncomment and remove mode 1)
# schedule:
#   mode: times
#   times:
#     - "08:00"
#     - "12:00"
#     - "17:00"
#     - "20:30"

# Mode 3: Solar-based (uncomment and remove modes 1 & 2)
# Requires: pip install astral
# Optionally uses OpenWeatherMap for refined times (set $TIMELAPSE_OWM_KEY).
# schedule:
#   mode: solar
#   latitude: 51.5074        # London
#   longitude: -0.1278
#   owm_api_key_env: "TIMELAPSE_OWM_KEY"   # env var name (not the key itself)
#   events:
#     - type: sunrise
#       offset_minutes: 10   # Capture 10 min after sunrise
#     - type: solar_noon
#       offset_minutes: 0
#     - type: sunset
#       offset_minutes: -15  # Capture 15 min before sunset

# ─── Disk guard ──────────────────────────────────────────────────────────────
disk:
  min_free_gb: 3.0          # Never let free space drop below this
  check_interval_s: 300     # How often to check (seconds)
  retention:
    # oldest_first:         delete oldest files regardless of type
    # oldest_videos_first:  delete old videos before photos
    policy: oldest_first

# ─── Video generation ────────────────────────────────────────────────────────
video:
  photos_per_video: 100     # Generate a video after this many photos
  fps: 10                   # Output video frame rate
  repeat: true              # true = keep capturing after each video
                            # false = stop after the first video, set status=completed
  after_video: move_to_archive   # move_to_archive | delete | keep
  video_codec: libx264      # libx264 (universal) or h264_v4l2m2m (Pi HW)
  crf: 23                   # Quality (0=lossless, 51=worst). 18-28 is typical. libx264 only.
  bitrate: "8M"             # Target bitrate for h264_v4l2m2m (which ignores crf).
                            # h264_v4l2m2m is limited to 1920x1080 frames.

# ─── Streaming ───────────────────────────────────────────────────────────────
# Live video is encoded ONCE by the Pi's hardware H.264 encoder and shared by
# every live output (live view and RTMP), so adding outputs costs network
# bandwidth, not CPU.
streaming:

  # Shared live video settings
  video:
    width: 1280            # Max 1920x1080 (hardware encoder limit), and no
    height: 720            # larger than capture.width x capture.height
    fps: 15                # Lower = less power, heat and bandwidth
    bitrate: "1500k"       # 1500k is plenty for 720p15; ~3M for 1080p30
    keyframe_interval_s: 2 # Viewers can only join on a keyframe

  # Live view
  preview:
    enabled: true
    # mediamtx: publish to a local MediaMTX server, which serves viewers over
    #           WebRTC (sub-second latency, any browser), HLS and RTSP, and
    #           handles logins.  Recommended.  See README § Live view.
    # mjpeg:    built-in web server; no extra software, but much more
    #           bandwidth per viewer and no WebRTC.
    mode: mediamtx

    # mediamtx mode: where to publish.  {profile} becomes the profile name,
    # so viewers open http://<pi>:8889/<profile>/ for WebRTC.
    publish_url: "rtsp://127.0.0.1:8554/{profile}"

    # mjpeg mode only:
    host: "0.0.0.0"        # 0.0.0.0 = whole LAN; 127.0.0.1 = this Pi only
    port: 8080
    mjpeg_fps: 5.0         # Per-viewer frame cap
    auth:
      enabled: true        # The server refuses to start if the password is unset
      username: "timelapse"
      # Password comes from this env var — NEVER store plaintext here
      password_env: "TIMELAPSE_WEB_PASSWORD"

  # RTMP push (YouTube / Twitch / Rumble / your own server)
  # For several platforms at once, push once to your server and fan out
  # from there — the Pi's Wi-Fi and your upload bandwidth are the limit.
  rtmp:
    enabled: false
    rtmp_url: "rtmp://a.rtmp.youtube.com/live2"
    # Stream key env var — NEVER paste the key here
    stream_key_env: "TIMELAPSE_RTMP_KEY_DEFAULT"
    # Optional: read from secrets file instead of env var
    # secrets_file: "~/.config/timelapse/secrets/default.env"
    silent_audio: true     # YouTube rejects video-only streams
